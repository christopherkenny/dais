[package]
name = "dais-document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dais-document"
keywords.workspace = true
categories.workspace = true
description = "Document source abstraction and PDF rendering for Dais"
readme = "README.md"

[features]
default = ["hayro"]
hayro = ["dep:hayro"]

[dependencies]
dais-core = { workspace = true }
dais-sidecar = { workspace = true }

hayro = { workspace = true, optional = true }
crossbeam-channel = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

typst = "0.14"
typst-pdf = "0.14"
typst-render = "0.14"
typst-svg = "0.14"
typst-library = "0.14"
typst-kit = { version = "0.14", features = ["fonts"] }

[lints]
workspace = true
