project:
  type: website
  output-dir: _site

website:
  title: Dais
  favicon: ../assets/dais.ico
  site-url: https://christopherkenny.github.io/dais
  repo-url: https://github.com/christopherkenny/dais
  repo-actions: [source, issue]
  description: A native PDF presenter console for academic and research talks.
  navbar:
    background: "#B31B1B"
    left:
      - text: Home
        href: index.qmd
      - text: Configuration
        href: configuration.md
      - text: Notes
        href: notes.md
      - text: Export
        href: export.md
      - text: Keybindings
        href: keybindings.md
      - text: Clickers
        href: clicker-setup.md
      - text: Remote
        href: remote.md
      - text: News
        href: news.qmd
    right:
      - icon: github
        href: https://github.com/christopherkenny/dais
  page-footer:
    left: |
      Dais documentation.
    right: |
      Built with [Quarto](https://quarto.org/).

format:
  html:
    theme:
      - flatly
      - custom.scss
    toc: false
    code-copy: true
    code-overflow: wrap
