[workspace]
members = [
    "crates/dais",
    "crates/dais-core",
    "crates/dais-sidecar",
    "crates/dais-document",
    "crates/dais-engine",
    "crates/dais-platform",
    "crates/dais-remote",
    "crates/dais-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
authors = ["Christopher T. Kenny"]
license = "MIT"
repository = "https://github.com/christopherkenny/dais"
homepage = "https://github.com/christopherkenny/dais"
documentation = "https://christophertkenny.com/dais/"
keywords = ["pdf", "presentation", "slides"]
categories = ["command-line-utilities", "multimedia"]

[workspace.dependencies]
# Internal crates
dais-core = { path = "crates/dais-core", version = "0.1.1" }
dais-sidecar = { path = "crates/dais-sidecar", version = "0.1.1" }
dais-document = { path = "crates/dais-document", version = "0.1.1" }
dais-engine = { path = "crates/dais-engine", version = "0.1.1" }
dais-platform = { path = "crates/dais-platform", version = "0.1.1" }
dais-remote = { path = "crates/dais-remote", version = "0.1.1" }
dais-ui = { path = "crates/dais-ui", version = "0.1.1" }

# PDF rendering
hayro = { version = "0.6", features = ["embed-fonts"] }

# GUI
egui = "0.33"
eframe = "0.33"
egui_commonmark = "0.22"

# Core
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
clap = { version = "4", features = ["derive"] }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
image = "0.25"
winresource = "0.1"
fastrand = "2"
qrcode = "0.14"

# Platform-specific (conditional)
[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

# Optimize heavy rendering deps even in debug builds.
# Without this, hayro renders are ~50x slower in dev profile.
[profile.dev.package.hayro]
opt-level = 2
[profile.dev.package.hayro-interpret]
opt-level = 2
[profile.dev.package.hayro-syntax]
opt-level = 2
[profile.dev.package.vello_cpu]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow these pedantic lints project-wide (revisit as code matures)
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
match_same_arms = "allow"
